name: Swing Study (daily trend + momentum, paper research, no orders)

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "watchlist or largecap"
        default: "largecap"

permissions:
  contents: write

concurrency:
  group: swing-research
  cancel-in-progress: false

jobs:
  swing:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Download adjusted daily history (Yahoo) and run both strategies
        env:
          PYTHONUNBUFFERED: "1"
          SWING_UNIVERSE: ${{ inputs.universe }}
        run: python -u -m app.swing
      - name: Commit results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add swing_results 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "chore: swing study results"
            git pull -q --rebase -X theirs origin main || true
            git push -q origin HEAD:main || true
          fi
