name: Strategy B Daily Paper Summary

on:
  workflow_dispatch:
  schedule:
    # 16:15 India Standard Time, Monday-Friday (UTC is 10:45).
    - cron: "45 10 * * 1-5"

permissions:
  contents: read

jobs:
  daily-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile and test
        run: |
          python -m compileall -q app tests strategy_b_original.py
          python -m unittest discover -s tests -v

      - name: Send daily paper summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.daily_summary
