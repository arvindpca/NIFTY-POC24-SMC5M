name: Backtest (paper research, no orders)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of recent completed trading days to replay"
        default: "10"
      include_today:
        description: "Include today's (completed) session"
        default: "false"
      source:
        description: "Data source: angel (months of history) or yahoo (~60 days max)"
        default: "angel"

permissions:
  contents: write

# Never overlap with the live loop's Angel session (a second login can invalidate it): run only outside market hours.
concurrency:
  group: backtest-research
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Replay live logic on historical 15m candles
        env:
          PAPER_ONLY: "true"
          BACKTEST_DAYS: ${{ inputs.days }}
          BACKTEST_INCLUDE_TODAY: ${{ inputs.include_today }}
          BACKTEST_SOURCE: ${{ inputs.source }}
          SMARTAPI_MIN_CALL_GAP_SEC: "0.45"
          SMARTAPI_MAX_CALL_GAP_SEC: "3.0"
          SMARTAPI_MAX_RETRIES: "3"
          SMARTAPI_BACKOFF_BASE_SEC: "10"
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python -u -m app.backtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-10d
          path: backtest_results/
      - name: Commit results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_results 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "chore: backtest results"
            git pull -q --rebase -X theirs origin main || true
            git push -q origin HEAD:main || true
          fi
