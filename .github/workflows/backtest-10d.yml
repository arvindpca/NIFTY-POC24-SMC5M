name: Backtest 10 Days (paper research, no orders)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of recent completed trading days to replay"
        default: "10"
      include_today:
        description: "Include today's (completed) session"
        default: "false"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Replay live logic on recent Yahoo 15m history
        env:
          PAPER_ONLY: "true"
          BACKTEST_DAYS: ${{ inputs.days }}
          BACKTEST_INCLUDE_TODAY: ${{ inputs.include_today }}
          PYTHONUNBUFFERED: "1"
        run: python -u -m app.backtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-10d
          path: backtest_results/
      - name: Commit results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_results 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "chore: 10-day backtest results"
            git pull -q --rebase -X theirs origin main || true
            git push -q origin HEAD:main || true
          fi
