name: Strategy B Paper Trading

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "30,45 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strategy-b-paper-trading
  cancel-in-progress: true

jobs:
  paper-trading:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore 15-minute candle cache
        uses: actions/cache/restore@v4
        with:
          path: data/candle_cache_15m
          key: candle-cache-15m-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            candle-cache-15m-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app tests strategy_b_original.py

      - name: Refresh verified NSE tokens for current scan universe
        run: python -m app.refresh_symbol_tokens

      - name: Verify required configuration exists
        run: |
          test -f config/symbol_tokens.csv || { echo "Missing config/symbol_tokens.csv"; exit 1; }
          python - <<'PY'
          import csv
          p = "config/symbol_tokens.csv"
          with open(p, newline="", encoding="utf-8-sig") as f:
              rows = list(csv.DictReader(f))
          required = {"symbol", "token", "exchange"}
          if not rows or not required.issubset(rows[0]):
              raise SystemExit("symbol_tokens.csv must have symbol,token,exchange columns")
          valid = [r for r in rows if all(str(r.get(c, "")).strip() for c in required)]
          if not any(str(r.get("symbol", "")).strip().upper() == "NIFTY" and str(r.get("token", "")).strip() and str(r.get("exchange", "")).strip().upper() == "NSE" for r in valid):
              raise SystemExit("A verified NSE NIFTY index token is required")
          symbols = [str(r["symbol"]).strip().upper() for r in valid]
          if len(symbols) != len(set(symbols)):
              raise SystemExit("Duplicate symbols found in config/symbol_tokens.csv")
          tokens = [str(r["token"]).strip() for r in valid]
          if len(tokens) != len(set(tokens)):
              raise SystemExit("Duplicate tokens found in config/symbol_tokens.csv")
          if len(valid) < 2:
              raise SystemExit("Add NIFTY and at least one verified stock token")
          print(f"Token configuration OK: {len(valid)} instruments")
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Continuous paper-only scan (every 5 min, NSE session only)
        env:
          PAPER_ONLY: "true"
          PAPER_SCAN_BATCH_SIZE: "174"
          SMARTAPI_MIN_CALL_GAP_SEC: "1.25"
          SMARTAPI_MAX_RETRIES: "0"
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_COST_BPS_PER_SIDE: "0"
          PAPER_ALLOW_OFFSESSION_SCAN: "false"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          persist() {
            git add config/symbol_tokens.csv data/unresolved_symbols.csv data/paper_state.json data/trade_history.csv data/system_log.csv data/scan_diagnostics.csv data/strategy_b_paper_history.xlsx 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "chore: persist paper scanner outputs"
              git pull -q --rebase origin main || git rebase --abort
              git push -q origin HEAD:main || echo "push failed; will retry next cycle"
            fi
          }
          hard_stop=$(( $(date +%s) + 20400 ))
          while true; do
            echo "=== cycle $(TZ=Asia/Kolkata date '+%F %T IST') ==="
            timeout --signal=TERM --kill-after=15s 1200s python -u -m app.main || echo "cycle failed or timed out after 1200s (see log above); continuing"
            persist
            now=$(date +%s)
            if [ "$now" -ge "$hard_stop" ]; then break; fi
            next=$(( (now / 300 + 1) * 300 + 20 ))
            sleep $(( next - now ))
          done
          echo "Temporary all-hours scan loop finished at GitHub Actions runtime limit."

      - name: Save 15-minute candle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/candle_cache_15m
          key: candle-cache-15m-${{ github.ref_name }}-${{ github.run_id }}

      - name: Persist paper state, verified token master, and unresolved-symbol report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/symbol_tokens.csv data/unresolved_symbols.csv data/paper_state.json data/trade_history.csv data/system_log.csv data/scan_diagnostics.csv data/strategy_b_paper_history.xlsx 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "chore: persist paper scanner outputs"
            git pull -q --rebase origin main || git rebase --abort
            git push -q origin HEAD:main || true
          fi
