name: NIFTY_SMC_POC Telegram Delivery Test

on:
  workflow_dispatch:
  # Send clearly labelled sample-only messages after notification-test changes.
  push:
    branches: [main]
    paths:
      - "app/telegram_preview.py"
      - "app/notifications.py"
      - ".github/workflows/telegram-design-preview.yml"

permissions:
  contents: read

jobs:
  telegram-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate code and unit tests
        run: |
          python -m compileall -q app tests strategy_b_original.py
          python -m unittest discover -s tests -v

      - name: Send sample-only Telegram messages and verify API acknowledgements
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.telegram_preview
