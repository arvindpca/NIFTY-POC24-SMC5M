name: Read-Only SmartAPI Diagnostic

on:
  workflow_dispatch:
  # Manual only: a push-triggered diagnostic would hold the shared API-key queue
  # and delay the scheduled live paper-trading scan.

permissions:
  contents: read

# Share one API key/rate limit with paper trading: never run both at once.
concurrency:
  group: strategy-b-paper-trading
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile and unit tests
        run: |
          python -m compileall -q app tests strategy_b_original.py
          python -m unittest discover -s tests -v

      - name: Read-only verify all configured instrument tokens and candles
        env:
          PAPER_ONLY: "true"
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python -m app.diagnostics
