name: Read-Only SmartAPI Diagnostic

on:
  workflow_dispatch:
  # Read-only live-data verification only when diagnostic inputs change on main.
  push:
    branches: [main]
    paths:
      - "app/diagnostics.py"
      - "app/smartapi_client.py"
      - "config/symbol_tokens.csv"
      - ".github/workflows/smartapi-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile and unit tests
        run: |
          python -m compileall -q app tests strategy_b_original.py
          python -m unittest discover -s tests -v

      - name: Read-only verify all configured instrument tokens and candles
        env:
          PAPER_ONLY: "true"
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python -m app.diagnostics
