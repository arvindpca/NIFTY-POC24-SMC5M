name: SmartAPI Check (read-only, any time)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smartapi-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m app.refresh_symbol_tokens
      - name: Login and fetch a few candles (no orders)
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          SMARTAPI_MIN_CALL_GAP_SEC: "0.5"
        run: python -u -m app.api_check
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/api_check.txt
          git commit -q -m "chore: smartapi check result" || exit 0
          git pull -q --rebase origin main; git push -q origin HEAD:main
